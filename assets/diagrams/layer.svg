<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 730" role="img" aria-labelledby="title"><title id="title">Pre-norm Transformer 层，包含两条残差路径</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#688878"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#294c3d;font-size:17px}.small{font-size:14px;fill:#607967}.title{font-size:21px;font-weight:700}.mono{font-family:Consolas,monospace;font-size:18px}rect{fill:#f0f5eb;stroke:#bdd0ba;stroke-width:1.2}.warm{fill:#fbf0e2;stroke:#cfb398}.dark{fill:#dcece0;stroke:#6a9c7c}.line{fill:none;stroke:#688878;stroke-width:1.8;marker-end:url(#a)}</style><rect width="760" height="730" style="fill:#fdfefa;stroke:none"/><text x="30" y="35" class="title" text-anchor="start">一层内部：先归一化，再变换，再残差相加</text><rect x="220" y="65" width="320" height="55" rx="5" class=""/><text x="380.0" y="98.5" class="" text-anchor="middle">输入 H(l)：N × d</text><path class="line" d="M380 120 L380 150"/><rect x="220" y="150" width="320" height="55" rx="5" class=""/><text x="380.0" y="183.5" class="" text-anchor="middle">T5 风格 LayerNorm</text><path class="line" d="M380 205 L380 235"/><rect x="220" y="235" width="320" height="70" rx="5" class="dark"/><text x="380.0" y="270.0" class="" text-anchor="middle">多头 Self-Attention</text><text x="380.0" y="294.0" class="small" text-anchor="middle">Q/K 加入 RoPE；输出仍为 N × d</text><path class="line" d="M380 305 L380 345"/><rect x="220" y="345" width="320" height="55" rx="5" class=""/><text x="380.0" y="378.5" class="" text-anchor="middle">U = H(l) + Attention 输出</text><path class="line" d="M220 92H115V372H220"/><text x="105" y="240" class="small" text-anchor="middle">保留原输入</text><path class="line" d="M380 400 L380 435"/><rect x="220" y="435" width="320" height="55" rx="5" class=""/><text x="380.0" y="468.5" class="" text-anchor="middle">T5 风格 LayerNorm</text><path class="line" d="M380 490 L380 525"/><rect x="220" y="525" width="320" height="70" rx="5" class="warm"/><text x="380.0" y="560.0" class="" text-anchor="middle">FFN / MLP</text><text x="380.0" y="584.0" class="small" text-anchor="middle">同一变换逐位置应用：384→1536→384</text><path class="line" d="M380 595 L380 635"/><rect x="220" y="635" width="320" height="55" rx="5" class=""/><text x="380.0" y="668.5" class="" text-anchor="middle">H(l+1) = U + FFN 输出</text><path class="line" d="M540 372H640V662H540"/><text x="644" y="510" class="small" text-anchor="middle">保留 U</text><text x="380" y="718" class="small" text-anchor="middle">为清晰省略训练 Dropout；归一化顺序依据官方 T5DecoderLayer。</text></svg>