<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 445" role="img" aria-labelledby="title"><title id="title">字符初始向量、上下文序列与铭文级检索向量的区别</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#688878"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#294c3d;font-size:17px}.small{font-size:14px;fill:#607967}.title{font-size:21px;font-weight:700}.mono{font-family:Consolas,monospace;font-size:18px}rect{fill:#f0f5eb;stroke:#bdd0ba;stroke-width:1.2}.warm{fill:#fbf0e2;stroke:#cfb398}.dark{fill:#dcece0;stroke:#6a9c7c}.line{fill:none;stroke:#688878;stroke-width:1.8;marker-end:url(#a)}</style><rect width="760" height="445" style="fill:#fdfefa;stroke:none"/><text x="30" y="35" class="title" text-anchor="start">三个“Embedding”，三个不同对象</text><rect x="145" y="65" width="470" height="70" rx="5" class=""/><text x="380.0" y="100.0" class="" text-anchor="middle">字符查表 E[id]：每个字符类型一个初始向量</text><text x="380.0" y="124.0" class="small" text-anchor="middle">相同 s 的查表结果相同；还没有整句上下文</text><path class="line" d="M380 135 L380 175"/><rect x="145" y="175" width="470" height="85" rx="5" class="dark"/><text x="380.0" y="217.5" class="" text-anchor="middle">上下文 H = [h₁, h₂, …, hN]：N × d</text><text x="380.0" y="241.5" class="small" text-anchor="middle">h₁ 是前缀；h₂…hN 与文字位置对齐</text><path class="line" d="M145 215H45V365H145"/><text x="65" y="305" class="small" text-anchor="middle">任务头</text><path class="line" d="M380 260 L380 310"/><rect x="145" y="310" width="470" height="85" rx="5" class="warm"/><text x="380.0" y="352.5" class="" text-anchor="middle">聚合 z：1 × d，用于整条铭文的比较</text><text x="380.0" y="376.5" class="small" text-anchor="middle">z = (h₁ + (h₂ + … + hN) / N) / 2</text><text x="380" y="429" class="small" text-anchor="middle">检索不是拿单个 s 的初始 Embedding 去寻找另一座祭坛。</text></svg>