<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-labelledby="title"><title id="title">多任务损失如何通过梯度共同更新共享参数</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#688878"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#294c3d;font-size:17px}.small{font-size:14px;fill:#607967}.title{font-size:21px;font-weight:700}.mono{font-family:Consolas,monospace;font-size:18px}rect{fill:#f0f5eb;stroke:#bdd0ba;stroke-width:1.2}.warm{fill:#fbf0e2;stroke:#cfb398}.dark{fill:#dcece0;stroke:#6a9c7c}.line{fill:none;stroke:#688878;stroke-width:1.8;marker-end:url(#a)}</style><rect width="760" height="490" style="fill:#fdfefa;stroke:none"/><text x="30" y="35" class="title" text-anchor="start">同一个主干，接收多条监督信号</text><rect x="190" y="65" width="380" height="70" rx="5" class="dark"/><text x="380.0" y="100.0" class="" text-anchor="middle">共享参数 θ：Embedding + 16 层主干</text><text x="380.0" y="124.0" class="small" text-anchor="middle">前向：字符 → H</text><path class="line" d="M380 135V170H125V205"/><path class="line" d="M380 170V205"/><path class="line" d="M380 170H635V205"/><rect x="30" y="205" width="190" height="80" rx="5" class=""/><text x="125.0" y="245.0" class="" text-anchor="middle">修复 / 长度损失</text><text x="125.0" y="269.0" class="small" text-anchor="middle">已知文字人工遮挡</text><rect x="285" y="205" width="190" height="80" rx="5" class=""/><text x="380.0" y="245.0" class="" text-anchor="middle">年代损失</text><text x="380.0" y="269.0" class="small" text-anchor="middle">预测分布对照标注</text><rect x="540" y="205" width="190" height="80" rx="5" class=""/><text x="635.0" y="245.0" class="" text-anchor="middle">地域损失</text><text x="635.0" y="269.0" class="small" text-anchor="middle">预测省份对照标签</text><path class="line" d="M125 285V330H380V365"/><path class="line" d="M635 285V330H380"/><path class="line" d="M380 285 L380 365"/><rect x="190" y="365" width="380" height="75" rx="5" class="warm"/><text x="380.0" y="402.5" class="" text-anchor="middle">加权损失 L → ∇θL → 更新 θ</text><text x="380.0" y="426.5" class="small" text-anchor="middle">各任务梯度相加；也可能互相冲突</text><text x="380" y="478" class="small" text-anchor="middle">“表示有历史信息”是代理任务的目标；逐个组件的因果收益仍需消融。</text></svg>