<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title"><title id="title">字符、编号与向量查表：教学编号与缩小维度</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#688878"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#294c3d;font-size:17px}.small{font-size:14px;fill:#607967}.title{font-size:21px;font-weight:700}.mono{font-family:Consolas,monospace;font-size:18px}rect{fill:#f0f5eb;stroke:#bdd0ba;stroke-width:1.2}.warm{fill:#fbf0e2;stroke:#cfb398}.dark{fill:#dcece0;stroke:#6a9c7c}.line{fill:none;stroke:#688878;stroke-width:1.8;marker-end:url(#a)}</style><rect width="760" height="390" style="fill:#fdfefa;stroke:none"/><text x="30" y="35" class="title" text-anchor="start">从字符到可计算的表示</text><rect x="25" y="70" width="170" height="74" rx="5" class=""/><text x="110.0" y="107.0" class="" text-anchor="middle">转录字符</text><text x="110.0" y="131.0" class="small" text-anchor="middle">s e n a t u s</text><path class="line" d="M195 107 L245 107"/><rect x="245" y="70" width="195" height="74" rx="5" class=""/><text x="342.5" y="107.0" class="" text-anchor="middle">Token ID</text><text x="342.5" y="131.0" class="small" text-anchor="middle">17 4 11 1 18 20 17</text><path class="line" d="M440 107 L490 107"/><rect x="490" y="70" width="240" height="74" rx="5" class=""/><text x="610.0" y="107.0" class="" text-anchor="middle">查找 Embedding 表</text><text x="610.0" y="131.0" class="small" text-anchor="middle">ID 只是索引，不是大小</text><rect x="55" y="190" width="275" height="115" rx="5" class="warm"/><text x="192.5" y="247.5" class="" text-anchor="middle">E[17] = [1, 0]</text><text x="192.5" y="271.5" class="small" text-anchor="middle">第 1、7 个 s 查到同一行</text><path class="line" d="M330 247 L390 247"/><rect x="390" y="190" width="310" height="115" rx="5" class=""/><text x="545.0" y="247.5" class="" text-anchor="middle">X = [E[s]; E[e]; E[n]; …]</text><text x="545.0" y="271.5" class="small" text-anchor="middle">7 × d；每一行对应一个位置</text><text x="380" y="350" class="small" text-anchor="middle">真实输入还含前缀与空格；本图 ID、二维数值均为教学设定。</text></svg>