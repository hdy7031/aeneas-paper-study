<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">同一输入经过三个不同线性投影得到 Q、K、V</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#688878"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#294c3d;font-size:17px}.small{font-size:14px;fill:#607967}.title{font-size:21px;font-weight:700}.mono{font-family:Consolas,monospace;font-size:18px}rect{fill:#f0f5eb;stroke:#bdd0ba;stroke-width:1.2}.warm{fill:#fbf0e2;stroke:#cfb398}.dark{fill:#dcece0;stroke:#6a9c7c}.line{fill:none;stroke:#688878;stroke-width:1.8;marker-end:url(#a)}</style><rect width="760" height="350" style="fill:#fdfefa;stroke:none"/><text x="30" y="35" class="title" text-anchor="start">Q / K / V 从哪里来？</text><rect x="25" y="145" width="180" height="85" rx="5" class=""/><text x="115.0" y="187.5" class="" text-anchor="middle">X：3 × 2</text><text x="115.0" y="211.5" class="small" text-anchor="middle">s、e、n 三行</text><path class="line" d="M205 188H245V95H295"/><path class="line" d="M245 188H295"/><path class="line" d="M245 188V281H295"/><rect x="295" y="60" width="165" height="70" rx="5" class=""/><text x="377.5" y="95.0" class="" text-anchor="middle">× WQ</text><text x="377.5" y="119.0" class="small" text-anchor="middle">2 × 2</text><path class="line" d="M460 95 L505 95"/><rect x="505" y="60" width="220" height="70" rx="5" class=""/><text x="615.0" y="95.0" class="" text-anchor="middle">Q = XWQ</text><text x="615.0" y="119.0" class="small" text-anchor="middle">我要匹配什么？</text><rect x="295" y="153" width="165" height="70" rx="5" class=""/><text x="377.5" y="188.0" class="" text-anchor="middle">× WK</text><text x="377.5" y="212.0" class="small" text-anchor="middle">2 × 2</text><path class="line" d="M460 188 L505 188"/><rect x="505" y="153" width="220" height="70" rx="5" class=""/><text x="615.0" y="188.0" class="" text-anchor="middle">K = XWK</text><text x="615.0" y="212.0" class="small" text-anchor="middle">我提供什么线索？</text><rect x="295" y="246" width="165" height="70" rx="5" class=""/><text x="377.5" y="281.0" class="" text-anchor="middle">× WV</text><text x="377.5" y="305.0" class="small" text-anchor="middle">2 × 2</text><path class="line" d="M460 281 L505 281"/><rect x="505" y="246" width="220" height="70" rx="5" class="warm"/><text x="615.0" y="281.0" class="" text-anchor="middle">V = XWV</text><text x="615.0" y="305.0" class="small" text-anchor="middle">真正被汇总的内容</text></svg>