<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title"><title id="title">多头注意力独立投影、并行计算、拼接和输出投影</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#688878"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#294c3d;font-size:17px}.small{font-size:14px;fill:#607967}.title{font-size:21px;font-weight:700}.mono{font-family:Consolas,monospace;font-size:18px}rect{fill:#f0f5eb;stroke:#bdd0ba;stroke-width:1.2}.warm{fill:#fbf0e2;stroke:#cfb398}.dark{fill:#dcece0;stroke:#6a9c7c}.line{fill:none;stroke:#688878;stroke-width:1.8;marker-end:url(#a)}</style><rect width="760" height="470" style="fill:#fdfefa;stroke:none"/><text x="30" y="35" class="title" text-anchor="start">并行比较，再回到共享表示宽度</text><rect x="30" y="180" width="115" height="70" rx="5" class=""/><text x="87.5" y="221.0" class="" text-anchor="middle">同一个 X</text><path class="line" d="M145 215H178V110H215"/><path class="line" d="M178 215V310H215"/><rect x="215" y="65" width="260" height="90" rx="5" class=""/><text x="345.0" y="110.0" class="" text-anchor="middle">头 1：Q₁ / K₁ / V₁</text><text x="345.0" y="134.0" class="small" text-anchor="middle">独立计算 A₁V₁ → 3 × 2</text><rect x="215" y="265" width="260" height="90" rx="5" class="warm"/><text x="345.0" y="310.0" class="" text-anchor="middle">头 2：Q₂ / K₂ / V₂</text><text x="345.0" y="334.0" class="small" text-anchor="middle">独立计算 A₂V₂ → 3 × 2</text><path class="line" d="M475 110H510V190H550"/><path class="line" d="M475 310H510V230H550"/><rect x="550" y="170" width="180" height="85" rx="5" class="dark"/><text x="640.0" y="212.5" class="" text-anchor="middle">Concat → WO</text><text x="640.0" y="236.5" class="small" text-anchor="middle">3 × 4 → 3 × 2</text><text x="380" y="405" class="small" text-anchor="middle">真实配置：8 头 × 每头 32 维 = 256；输出投影再映射回 384。</text><text x="380" y="440" class="small" text-anchor="middle">不同头有不同参数，但不保证每个头有固定、可命名的历史分工。</text></svg>