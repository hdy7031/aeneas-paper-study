<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title"><title id="title">相同字符在不同上下文中得到不同表示</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#688878"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#294c3d;font-size:17px}.small{font-size:14px;fill:#607967}.title{font-size:21px;font-weight:700}.mono{font-family:Consolas,monospace;font-size:18px}rect{fill:#f0f5eb;stroke:#bdd0ba;stroke-width:1.2}.warm{fill:#fbf0e2;stroke:#cfb398}.dark{fill:#dcece0;stroke:#6a9c7c}.line{fill:none;stroke:#688878;stroke-width:1.8;marker-end:url(#a)}</style><rect width="760" height="340" style="fill:#fdfefa;stroke:none"/><text x="30" y="35" class="title" text-anchor="start">相同初始向量，不同上下文表示</text><rect x="30" y="70" width="250" height="72" rx="5" class=""/><text x="155.0" y="106.0" class="" text-anchor="middle">senatus 中的 s</text><text x="155.0" y="130.0" class="small" text-anchor="middle">E[s] = [1, 0]</text><path class="line" d="M280 106 L340 106"/><rect x="340" y="70" width="380" height="72" rx="5" class="dark"/><text x="530.0" y="106.0" class="" text-anchor="middle">Transformer 结合 e n a t u s</text><text x="530.0" y="130.0" class="small" text-anchor="middle">h(s, senatus) = fθ(E, 位置关系)</text><rect x="30" y="195" width="250" height="72" rx="5" class=""/><text x="155.0" y="231.0" class="" text-anchor="middle">salute 中的 s</text><text x="155.0" y="255.0" class="small" text-anchor="middle">E[s] = [1, 0]</text><path class="line" d="M280 231 L340 231"/><rect x="340" y="195" width="380" height="72" rx="5" class="warm"/><text x="530.0" y="231.0" class="" text-anchor="middle">Transformer 结合 a l u t e</text><text x="530.0" y="255.0" class="small" text-anchor="middle">h(s, salute) 通常与上行不同</text><text x="380" y="315" class="small" text-anchor="middle">关系随输入计算；不是为同一个 s 永久登记多个“词义 ID”。</text></svg>