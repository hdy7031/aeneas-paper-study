"85" rx="5" class="warm"/><text x="155.0" y="367.5" class="" text-anchor="middle">字符位置表示 → 修复</text><text x="155.0" y="391.5" class="small" text-anchor="middle">含未知长度判断</text><rect x="300" y="325" width="230" height="85" rx="5" class=""/><text x="415.0" y="367.5" class="" text-anchor="middle">前缀 h₁ → 年代</text><text x="415.0" y="391.5" class="small" text-anchor="middle">160 个十年区间</text><rect x="560" y="325" width="210" height="85" rx="5" class=""/><text x="665.0" y="367.5" class="" text-anchor="middle">h₁ 与 v 拼接 → 地域</text><text x="665.0" y="391.5" class="small" text-anchor="middle">62 个罗马行省</text><path class="line" d="M645 250 L670 325"/><path class="line" d="M35 215H15V500H130"/><rect x="130" y="465" width="540" height="70" rx="5" class="dark"/><text x="400.0" y="500.0" class="" text-anchor="middle">H → 聚合铭文向量 z → 余弦检索</text><text x="400.0" y="524.0" class="small" text-anchor="middle">只取文字主干表示，不接收图像或预测年份</text><path class="line" d="M400 535 L400 575"/><rect x="130" y="575" width="540" height="60" rx="5" class=""/><text x="400.0" y="611.0" class="" text-anchor="middle">LED 训练集中的真实平行铭文候选</text><text x="400" y="658" class="small" text-anchor="middle">原创教学重绘；具体任务事实依据原图与 Methods，不代表训练顺序。</text></svg>