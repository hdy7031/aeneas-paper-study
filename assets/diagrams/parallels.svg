<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 415" role="img" aria-labelledby="title"><title id="title">字面匹配与研究候选的差别，虚构教学记录</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#688878"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#294c3d;font-size:17px}.small{font-size:14px;fill:#607967}.title{font-size:21px;font-weight:700}.mono{font-family:Consolas,monospace;font-size:18px}rect{fill:#f0f5eb;stroke:#bdd0ba;stroke-width:1.2}.warm{fill:#fbf0e2;stroke:#cfb398}.dark{fill:#dcece0;stroke:#6a9c7c}.line{fill:none;stroke:#688878;stroke-width:1.8;marker-end:url(#a)}</style><rect width="760" height="415" style="fill:#fdfefa;stroke:none"/><text x="30" y="35" class="title" text-anchor="start">同样的查询，为什么会需要不同参照？</text><rect x="35" y="65" width="690" height="65" rx="5" class="dark"/><text x="380.0" y="97.5" class="" text-anchor="middle">查询：某军职人员奉献祭坛，为家人祈福</text><text x="380.0" y="121.5" class="small" text-anchor="middle">研究问题：是否属于某种军队宗教实践？</text><rect x="35" y="185" width="210" height="115" rx="5" class=""/><text x="140.0" y="242.5" class="" text-anchor="middle">A：相同祈福词</text><text x="140.0" y="266.5" class="small" text-anchor="middle">商业契约；社会功能不同</text><rect x="275" y="185" width="210" height="115" rx="5" class="warm"/><text x="380.0" y="242.5" class="" text-anchor="middle">B：不同措辞</text><text x="380.0" y="266.5" class="small" text-anchor="middle">同类军职 + 神明奉献</text><rect x="515" y="185" width="210" height="115" rx="5" class=""/><text x="620.0" y="242.5" class="" text-anchor="middle">C：同一城市</text><text x="620.0" y="266.5" class="small" text-anchor="middle">另一时代的墓志</text><text x="380" y="350" class="" text-anchor="middle">字面搜索容易发现 A；B 可能更值得比较；C 需要具体判断。</text><text x="380" y="389" class="small" text-anchor="middle">教学假设：并非真实 Aeneas 排名，也不说明关键词搜索没有价值。</text></svg>